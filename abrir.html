<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Volver a Portal CEQ</title><link rel="icon" href="favicon.png"><style>
:root{--marino:#173874;--celeste:#2A8FCC;--cielo:#EFF7FE;--texto:#1d2433;--suave:#5b6577;--fondo:#ffffff}
@media (prefers-color-scheme:dark){:root{--marino:#9cc0ff;--cielo:#172238;--texto:#e7ecf5;--suave:#a8b3c7;--fondo:#0e1524}}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texto);background:var(--fondo);line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.c{max-width:420px;width:100%;text-align:center}
img{width:72px;height:72px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 2px 10px rgba(23,56,116,.15)}
h1{color:var(--marino);font-size:1.45rem;margin:18px 0 8px}p{margin:0 0 14px;color:var(--suave)}
.boton{display:block;background:var(--celeste);color:#fff;text-decoration:none;font-weight:700;font-size:1.05rem;padding:15px 18px;border-radius:14px;margin:22px 0 12px}
.boton:active{opacity:.85}.tarjeta{background:var(--cielo);border-radius:14px;padding:14px 16px;text-align:left;font-size:.95rem}
[hidden]{display:none!important}
</style></head><body>
<main class="c">
<img src="logo-ceq.png" alt="">
<h1 id="titulo">Listo</h1>
<p id="texto">Tocá el botón para volver a la app.</p>
<a id="boton" class="boton" href="#">Abrir Portal CEQ</a>
<div class="tarjeta" id="ayuda">Si el botón no abre nada, abrí Portal CEQ a mano. Si estabas confirmando tu correo, entrá con <strong>Iniciar sesión</strong> y tu correo y contraseña.</div>
</main>
<script>
(function () {
  // Los enlaces de los correos de Supabase llegan acá (Gmail los abre en su
  // propio navegador, que no deja saltar solo a ceqapp://). Desde acá un toque
  // del botón sí abre la app, con el mismo código del enlace.
  var RUTAS = {
    'auth/callback': ['¡Correo confirmado!', 'Tu cuenta ya está activa. Tocá el botón para entrar a la app.'],
    'auth/restablecer': ['Elegí tu contraseña nueva', 'Tocá el botón para seguir en la app.'],
    'auth/pin': ['Elegí tu PIN nuevo', 'Tocá el botón para seguir en la app, en el mismo celular donde lo pediste.']
  };
  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var ruta = q.get('ruta');
  if (!RUTAS.hasOwnProperty(ruta)) ruta = 'auth/callback';
  var sal = new URLSearchParams();
  ['code', 'sb_flow_id', 'error', 'error_code', 'error_description'].forEach(function (k) {
    var v = q.get(k) || h.get(k);
    if (v) sal.set(k, v);
  });
  // Saca el código de la barra de direcciones y del historial.
  try { history.replaceState(null, '', location.pathname + '?ruta=' + encodeURIComponent(ruta)); } catch (e) {}
  var titulo = RUTAS[ruta][0], texto = RUTAS[ruta][1];
  if (sal.get('error')) {
    titulo = 'El enlace no sirvió';
    texto = /expired|invalid/i.test(sal.get('error_description') || sal.get('error_code') || '')
      ? 'El enlace venció o ya se usó. Pedí uno nuevo desde la app.'
      : 'No pudimos abrir el enlace. Pedí uno nuevo desde la app.';
  }
  document.getElementById('titulo').textContent = titulo;
  document.getElementById('texto').textContent = texto;
  document.title = titulo + ' · Portal CEQ';
  var resto = ruta + (sal.toString() ? '?' + sal.toString() : '');
  var esquema = 'ceqapp://' + resto;
  var android = /android/i.test(navigator.userAgent);
  var boton = document.getElementById('boton');
  boton.href = android
    ? 'intent://' + resto + '#Intent;scheme=ceqapp;package=com.ceqinformatica.app;end'
    : esquema;
  // Algunos navegadores sí dejan abrir la app sin tocar nada.
  if (!sal.get('error')) setTimeout(function () { location.href = esquema; }, 300);
})();
</script>
</body></html>
